<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jita DiSwadya - Il posto perfetto</title>
<meta name="description" content="Jita DiSwadya - Il posto perfetto - 1">
<meta name="theme-color" content="#11100e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f1eadc;
  --paper-soft:rgba(241,234,220,.72);
  --ink:#15110d;
  --panel:rgba(18,16,13,.62);
  --line:rgba(217,154,66,.30);
  --line-strong:rgba(217,154,66,.56);
  --warm:#d6af70;
  --amber:#d99a42;
  --amber-light:#ffc66d;
  --warm-soft:rgba(217,154,66,.18);
  --shadow:rgba(0,0,0,.58);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  width:100%;
  min-height:100%;
  margin:0;
  background:#0d0c0b;
  color:var(--paper);
  font-family:"Manrope",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
html{overflow-x:hidden}
body{position:relative;isolation:isolate;overflow-x:hidden}
.bg-video{
  position:fixed;
  inset:-2%;
  z-index:-20;
  width:104%;
  height:104%;
  object-fit:cover;
  filter:brightness(.58) saturate(.82) contrast(1.04);
  animation:videoDrift 18s ease-in-out infinite alternate;
}
@keyframes videoDrift{
  from{transform:scale(1.02) translate3d(-.7%,0,0)}
  to{transform:scale(1.055) translate3d(.7%,-.8%,0)}
}
.grade{
  position:fixed;
  inset:0;
  z-index:-10;
  background:
    linear-gradient(180deg,rgba(7,7,7,.36) 0%,rgba(11,10,9,.08) 31%,rgba(10,8,6,.56) 100%),
    linear-gradient(90deg,rgba(0,0,0,.30),transparent 28%,transparent 72%,rgba(0,0,0,.26));
}
.grain{
  position:fixed;
  inset:0;
  z-index:-9;
  pointer-events:none;
  opacity:.12;
  mix-blend-mode:soft-light;
  background-image:
    repeating-linear-gradient(0deg,rgba(255,255,255,.35) 0 1px,transparent 1px 3px),
    repeating-linear-gradient(90deg,rgba(0,0,0,.32) 0 1px,transparent 1px 4px);
}
.page{
  width:100%;
  min-height:100dvh;
  display:grid;
  grid-template-rows:1fr auto;
  padding:clamp(18px,4vw,42px) clamp(18px,4vw,42px) calc(clamp(28px,5vw,48px) + env(safe-area-inset-bottom));
}
.stage{
  width:min(100%,820px);
  margin:auto;
  display:grid;
  justify-items:center;
  gap:clamp(16px,2.7vh,24px);
  text-align:center;
}
.artist{
  display:grid;
  justify-items:center;
  gap:10px;
  animation:rise .7s cubic-bezier(.2,.8,.2,1) both;
}
.portrait{
  width:clamp(82px,12vh,118px);
  aspect-ratio:1;
  border-radius:50%;
  overflow:hidden;
  border:1px solid rgba(217,154,66,.42);
  box-shadow:0 14px 45px rgba(0,0,0,.34),0 0 0 7px rgba(217,154,66,.045);
  background:#17130f;
}
.portrait img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  filter:saturate(.82) contrast(1.04) brightness(.92);
}
.name{
  margin:0;
  font-family:"Instrument Serif",Georgia,serif;
  font-size:clamp(38px,6.2vw,76px);
  font-weight:400;
  line-height:.9;
  letter-spacing:0;
  text-shadow:0 20px 50px rgba(0,0,0,.42);
}
.tagline{
  margin:0;
  color:var(--paper-soft);
  font-size:clamp(12px,1.55vw,14px);
  font-weight:600;
}
.release-note{
  margin:clamp(2px,1vh,8px) 0 -6px;
  font-family:"Instrument Serif",Georgia,serif;
  font-size:clamp(20px,3vw,29px);
  font-style:italic;
  color:rgba(245,234,215,.88);
  text-shadow:0 0 28px rgba(217,154,66,.18);
  animation:rise .72s cubic-bezier(.2,.8,.2,1) .08s both;
}
.song{
  width:min(100%,620px);
  display:grid;
  justify-items:center;
  gap:clamp(14px,2vh,18px);
  padding:clamp(14px,2.2vw,18px);
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.018)),var(--panel);
  box-shadow:0 26px 90px var(--shadow),0 0 0 1px rgba(255,198,109,.035),inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(16px);
  position:relative;
  overflow:hidden;
  animation:rise .74s cubic-bezier(.2,.8,.2,1) .15s both;
}
.song:before{
  content:"";
  position:absolute;
  inset:0;
  border:1px solid rgba(255,198,109,.07);
  border-radius:inherit;
  pointer-events:none;
}
.song:after{
  content:"";
  position:absolute;
  width:38%;
  height:150%;
  top:-25%;
  left:-45%;
  background:linear-gradient(100deg,transparent,rgba(255,198,109,.095),transparent);
  transform:rotate(8deg);
  animation:glint 7.5s ease-in-out infinite;
}
@keyframes glint{
  0%,58%{left:-45%;opacity:0}
  68%{opacity:1}
  86%,100%{left:112%;opacity:0}
}
.cover{
  width:clamp(230px,39vh,360px);
  aspect-ratio:1;
  overflow:hidden;
  border:1px solid rgba(217,154,66,.36);
  border-radius:13px;
  box-shadow:0 24px 70px rgba(0,0,0,.48);
  background:#15120e;
  position:relative;
  z-index:1;
}
.cover img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  animation:coverBreath 8s ease-in-out infinite;
}
@keyframes coverBreath{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.018)}
}
.song-title{
  position:relative;
  z-index:1;
  display:grid;
  gap:5px;
}
.eyebrow{
  margin:0;
  color:rgba(255,198,109,.72);
  font-size:10px;
  font-weight:800;
  letter-spacing:.18em;
  text-transform:uppercase;
}
.title{
  margin:0;
  font-family:"Instrument Serif",Georgia,serif;
  font-size:clamp(30px,5vw,48px);
  font-weight:400;
  line-height:.96;
  letter-spacing:0;
}
.actions{
  position:relative;
  z-index:1;
  width:min(100%,430px);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.btn{
  min-height:48px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:0 18px;
  border-radius:12px;
  border:1px solid var(--line-strong);
  background:linear-gradient(180deg,rgba(245,234,215,.95),rgba(226,216,198,.92));
  color:var(--ink);
  text-decoration:none;
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
  transition:transform .2s ease,border-color .2s ease,background .2s ease,box-shadow .2s ease;
}
.btn:hover{
  transform:translateY(-2px);
  border-color:rgba(255,198,109,.92);
  background:linear-gradient(180deg,#fff3d4,#dfc18d);
  box-shadow:0 14px 34px rgba(0,0,0,.28),0 0 24px rgba(217,154,66,.16);
}
.btn svg{
  width:17px;
  height:17px;
  fill:currentColor;
  flex:0 0 auto;
}
.footer{
  width:min(100%,820px);
  margin:clamp(16px,2.4vh,26px) auto 0;
  padding-bottom:clamp(8px,1.8vh,18px);
  display:grid;
  justify-items:center;
  gap:11px;
  animation:fadeIn .75s ease .45s both;
}
.footer-socials{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
.icon-link{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:1px solid rgba(217,154,66,.32);
  border-radius:10px;
  background:rgba(15,13,11,.36);
  color:rgba(245,234,215,.84);
  text-decoration:none;
  transition:transform .18s ease,color .18s ease,border-color .18s ease,background .18s ease;
}
.icon-link:hover{
  transform:translateY(-2px);
  color:var(--amber-light);
  border-color:rgba(255,198,109,.64);
  background:rgba(15,13,11,.62);
}
.icon-link svg{
  width:17px;
  height:17px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.85;
  stroke-linecap:round;
  stroke-linejoin:round;
}
.copyright{
  margin:0;
  color:rgba(245,234,215,.55);
  font-size:10px;
  font-weight:700;
  letter-spacing:.08em;
  text-transform:uppercase;
}
@keyframes rise{
  from{opacity:0;transform:translate3d(0,14px,0)}
  to{opacity:1;transform:translate3d(0,0,0)}
}
@keyframes fadeIn{
  from{opacity:0}
  to{opacity:1}
}
@media(max-width:680px){
  .page{padding:16px 14px calc(48px + env(safe-area-inset-bottom))}
  .stage{gap:14px}
  .portrait{width:78px}
  .name{font-size:42px}
  .tagline{font-size:12px}
  .release-note{font-size:22px;margin-top:0}
  .song{width:100%;padding:14px;gap:13px;border-radius:20px}
  .cover{width:min(100%,280px);border-radius:14px}
  .title{font-size:32px}
  .actions{width:100%;gap:8px}
  .btn{min-height:45px;padding:0 12px;font-size:11px;border-radius:13px}
  .footer{gap:9px;margin-top:18px;padding-bottom:10px}
  .icon-link{border-radius:11px}
}
@media(max-width:370px){
  .page{padding:12px 12px calc(44px + env(safe-area-inset-bottom))}
  .artist{gap:8px}
  .portrait{width:68px}
  .name{font-size:36px}
  .song{padding:11px}
  .cover{width:min(100%,238px)}
  .release-note{font-size:20px}
  .title{font-size:29px}
  .btn{font-size:10px;letter-spacing:.06em}
}
@media(max-height:740px) and (min-width:681px){
  .portrait{width:82px}
  .name{font-size:50px}
  .cover{width:265px}
  .song{gap:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>
</head>
