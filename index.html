<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jita DiSwadya</title>
<meta name="description" content="Jita DiSwadya - Il posto perfetto - 1">
<meta name="theme-color" content="#050302">
<style>
:root{
  --cream:#f5ead7;
  --muted:rgba(245,234,215,.72);
  --gold:#d99a42;
  --gold2:#ffc66d;
  --line:rgba(255,198,109,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--cream);
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}
body{position:relative;isolation:isolate}
.bg-video{
  position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:-10;
  filter:brightness(.38) saturate(.86) contrast(1.04);transform:scale(1.03);
}
.overlay{
  position:fixed;inset:0;z-index:-9;
  background:
    radial-gradient(circle at 50% 10%, rgba(255,198,109,.19), transparent 24%),
    linear-gradient(180deg, rgba(0,0,0,.08), rgba(0,0,0,.68)),
    radial-gradient(circle at center, transparent 0 42%, rgba(0,0,0,.48) 100%);
}
.overlay:after{
  content:"";position:absolute;inset:0;opacity:.045;mix-blend-mode:overlay;
  background-image:
    repeating-radial-gradient(circle at 20% 30%, rgba(255,255,255,.9) 0 1px, transparent 1px 3px),
    repeating-radial-gradient(circle at 70% 60%, rgba(0,0,0,.9) 0 1px, transparent 1px 4px);
}
.light{
  position:fixed;width:52vmin;height:52vmin;left:50%;top:4%;transform:translateX(-50%);
  border-radius:999px;z-index:-8;background:radial-gradient(circle,rgba(255,198,109,.20),rgba(255,198,109,.03) 48%,transparent 72%);
  filter:blur(10px);animation:breathe 8s ease-in-out infinite;
}
@keyframes breathe{0%,100%{opacity:.55;transform:translateX(-50%) scale(.96)}50%{opacity:1;transform:translateX(-50%) scale(1.04)}}
.page{width:100%;height:100dvh;display:grid;place-items:center;padding:18px}
.wrap{width:min(100%,780px);display:grid;justify-items:center;gap:22px;animation:enter .8s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
.hero{display:grid;justify-items:center;text-align:center;gap:14px}
.profile{
  width:clamp(128px,22vh,210px);aspect-ratio:1;border-radius:999px;overflow:hidden;border:1px solid rgba(255,198,109,.32);
  box-shadow:0 0 0 10px rgba(255,198,109,.025),0 0 75px rgba(217,154,66,.18),0 24px 80px rgba(0,0,0,.46);
  animation:float 6s ease-in-out infinite;background:#090604;
}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.profile img{width:100%;height:100%;object-fit:cover;display:block;filter:contrast(1.05) saturate(.82) brightness(.88)}
.name{
  margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(44px,7vh,78px);line-height:.93;
  font-weight:500;letter-spacing:-.06em;text-shadow:0 0 28px rgba(217,154,66,.12);white-space:nowrap;
}
.tagline{margin:-4px 0 0;color:var(--muted);font-size:clamp(13px,1.8vh,16px)}
.songBox{
  width:min(100%,700px);display:grid;grid-template-columns:145px 1fr;gap:22px;align-items:center;border-radius:30px;
  border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.038),rgba(255,255,255,.012)),rgba(8,5,3,.58);
  backdrop-filter:blur(18px);box-shadow:0 24px 120px rgba(0,0,0,.50),inset 0 1px 0 rgba(255,255,255,.04);
  padding:20px;overflow:hidden;position:relative;
}
.songBox:before{
  content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 0 35%,rgba(255,198,109,.055) 48%,transparent 60%);
  transform:translateX(-120%);animation:shine 5.6s ease-in-out infinite;
}
@keyframes shine{0%,60%{transform:translateX(-120%)}82%,100%{transform:translateX(120%)}}
.cover{
  width:145px;aspect-ratio:1;border-radius:18px;overflow:hidden;border:1px solid rgba(255,198,109,.18);
  box-shadow:0 20px 60px rgba(0,0,0,.40);animation:coverPulse 5s ease-in-out infinite;position:relative;z-index:1;background:#090604;
}
@keyframes coverPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.018)}}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.info{position:relative;z-index:1}
.kicker{margin:0 0 10px;color:rgba(255,218,158,.82);font-size:10px;font-weight:850;letter-spacing:.23em;text-transform:uppercase}
.title{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(36px,5vw,56px);line-height:.95;font-weight:500;letter-spacing:-.055em}
.buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{
  min-height:44px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;
  color:var(--cream);border:1px solid rgba(255,198,109,.30);background:rgba(255,198,109,.05);
  font-size:11px;font-weight:850;letter-spacing:.14em;text-transform:uppercase;transition:.18s ease;
}
.btn:hover{transform:translateY(-2px);border-color:rgba(255,198,109,.72);background:rgba(255,198,109,.12)}
.btn.main{color:#120b04;background:linear-gradient(180deg,#ffc66d,#d99a42);border-color:rgba(255,212,136,.78)}
.play{width:0;height:0;border-top:6px solid transparent;border-bottom:6px solid transparent;border-left:10px solid currentColor}
.socials{width:min(100%,700px);display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.social{
  min-height:78px;border-radius:22px;border:1px solid rgba(245,234,215,.10);background:rgba(8,5,3,.40);color:rgba(245,234,215,.82);
  text-decoration:none;display:grid;place-items:center;gap:7px;padding:10px 4px;position:relative;overflow:hidden;transition:.18s ease;
}
.social:before{content:"";position:absolute;inset:0;opacity:0;background:radial-gradient(circle at center,rgba(255,198,109,.12),transparent 62%);transition:.18s ease}
.social:hover{transform:translateY(-3px);border-color:rgba(255,198,109,.34);color:var(--cream)}
.social:hover:before{opacity:1}
.social svg{
  width:24px;height:24px;stroke:var(--gold2);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 10px rgba(255,198,109,.16));position:relative;z-index:1;
}
.social strong{position:relative;z-index:1;font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}
@media(max-width:700px){
  .page{padding:14px}.wrap{gap:16px}.profile{width:112px}.name{font-size:39px}.tagline{font-size:13px}
  .songBox{width:100%;grid-template-columns:92px 1fr;gap:13px;padding:14px;border-radius:22px}
  .cover{width:92px;border-radius:15px}.kicker{font-size:9px;letter-spacing:.13em}.title{font-size:29px}
  .buttons{margin-top:13px;gap:8px}.btn{min-height:38px;padding:0 13px;font-size:9px;letter-spacing:.10em}
  .social{min-height:64px;border-radius:18px}.social svg{width:21px;height:21px}.social strong{font-size:7.5px;letter-spacing:.045em}
}
@media(max-width:370px){
  .profile{width:98px}.name{font-size:34px}.songBox{grid-template-columns:78px 1fr}.cover{width:78px}.title{font-size:25px}.btn{width:100%}.social{min-height:56px}
}
</style>
</head>
<body>
<video class="bg-video" autoplay muted loop playsinline>
  <source src="bg-video.mp4" type="video/mp4">
</video>
<div class="overlay"></div>
<div class="light"></div>

<main class="page">
  <section class="wrap">
    <header class="hero">
      <div class="profile"><img src="profile.jpg" alt="Jita DiSwadya"></div>
      <h1 class="name">Jita DiSwadya</h1>
      <p class="tagline">io canto le storie, tu le immagini.</p>
    </header>

    <section class="songBox">
      <div class="cover"><img src="cover.png" alt="Il posto perfetto - 1"></div>
      <div class="info">
        <p class="kicker">Ascolta la mia ultima canzone</p>
        <h2 class="title">Il posto perfetto - 1</h2>
        <div class="buttons">
          <a class="btn main" href="https://youtube.com/" target="_blank" rel="noopener noreferrer"><span class="play"></span>YouTube</a>
          <a class="btn" href="https://soundcloud.com/" target="_blank" rel="noopener noreferrer">SoundCloud</a>
        </div>
      </div>
    </section>

    <nav class="socials">
      <a class="social" href="https://youtube.com/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><path d="M3.5 8.8c.2-1.7 1.1-2.7 2.8-2.9 3.8-.4 7.6-.4 11.4 0 1.7.2 2.6 1.2 2.8 2.9.3 2.1.3 4.3 0 6.4-.2 1.7-1.1 2.7-2.8 2.9-3.8.4-7.6.4-11.4 0-1.7-.2-2.6-1.2-2.8-2.9-.3-2.1-.3-4.3 0-6.4Z"/><path d="m10 9 5 3-5 3V9Z" fill="currentColor" stroke="none"/></svg><strong>YouTube</strong>
      </a>
      <a class="social" href="https://soundcloud.com/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><path d="M6 17h11.2a3.3 3.3 0 0 0 .2-6.6 5.2 5.2 0 0 0-10-1.6A4.1 4.1 0 0 0 6 17Z"/><path d="M3.5 14.3v1.9M5.5 12.8v3.4M7.5 11.6v4.6M9.5 9.9v6.3"/></svg><strong>SoundCloud</strong>
      </a>
      <a class="social" href="https://instagram.com/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/><path d="M17.5 6.8h.01"/></svg><strong>Instagram</strong>
      </a>
      <a class="social" href="https://tiktok.com/" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24"><path d="M14 4v10.2a4.1 4.1 0 1 1-3.4-4"/><path d="M14 4c.7 3 2.5 4.7 5.5 5"/></svg><strong>TikTok</strong>
      </a>
    </nav>
  </section>
</main>
</body>
</html>
