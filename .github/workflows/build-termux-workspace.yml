name: Build Termux Workspace APK

on:
  push:
    branches:
      - build/termux-workspace-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK API 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract Termux Workspace source
        run: unzip -q android/TermuxWorkspace-REDMAGIC-sorgenti.zip -d build-src
      - name: Exclude duplicate multi-release JAR metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-src/TermuxWorkspace/app/build.gradle.kts")
          s = p.read_text()
          old = '"META-INF/NOTICE.md")'
          if old in s:
              s = s.replace(old, '"META-INF/NOTICE.md", "META-INF/versions/**")')
          elif '"META-INF/versions/**"' not in s:
              raise RuntimeError("Packaging rule not found")
          p.write_text(s)
          PY
      - name: Restore original Termux launchers
        run: python3 android/patch-original-launchers.py
      - name: Build debug APK
        working-directory: build-src/TermuxWorkspace
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: termux-workspace-debug-apk
          path: build-src/TermuxWorkspace/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
