name: Build Termux Workspace APK

on:
  push:
    branches:
      - build/termux-workspace-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK API 35
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extract Termux Workspace source
        run: unzip -q android/TermuxWorkspace-REDMAGIC-sorgenti.zip -d build-src
      - name: Build debug APK
        working-directory: build-src/TermuxWorkspace
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: termux-workspace-debug-apk
          path: build-src/TermuxWorkspace/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
